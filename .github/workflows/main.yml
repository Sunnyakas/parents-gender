name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk
          pip install buildozer cython
          
      - name: Build APK
        run: |
          # 强制让 buildozer 使用阿里云镜像下载关键文件（加速！）
          mkdir -p ~/.buildozer
          echo "[app]" > ~/.buildozer/default.spec
          echo "android.accept_sdk_license = True" >> ~/.buildozer/default.spec
          # 尝试使用国内镜像（或者GitHub官方缓存）进行编译
          buildozer android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: my-apk
          path: bin/*.apk
